<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3b"/>
      <stop offset="100%" stop-color="#0f2f4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d7b"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)" rx="8"/>
  <!-- Grid -->
  <g stroke="#1f3e5f" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="0" y1="100" x2="300" y2="100"/>
    <line x1="0" y1="200" x2="300" y2="200"/>
  </g>
  <!-- HexaDrone mark -->
  <g transform="translate(150 150)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle r="20" fill="#0b1d3b" stroke="#00e0ff" stroke-width="4"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#00e0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#00e0ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#ff2d7b"/>
  </g>
  <!-- Labels -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#94a9c9" font-weight="700">
    <text x="50" y="30">A1</text>
    <text x="150" y="30">A2</text>
    <text x="250" y="30">A3</text>
    <text x="50" y="130">B1</text>
    <text x="150" y="130">B2</text>
    <text x="250" y="130">B3</text>
    <text x="50" y="230">C1</text>
    <text x="150" y="230">C2</text>
    <text x="250" y="230">C3</text>
  </g>
</svg>
